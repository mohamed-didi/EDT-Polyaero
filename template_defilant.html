:root{
  --cyan:#009fe3; --cyan-clair:#83d0f5; --marine:#43358b; --gris:#dadada; --gris-pale:#f2f2f2;
  --noir:#1d1d1b; --blanc:#fff;
  --font-sans:"Roboto","Helvetica Neue",Arial,sans-serif;
  --font-condensed:"Roboto Condensed","Roboto","Arial Narrow",sans-serif;
  --prog:#3aaa35; --prog-texte:#1d1d1b; --prog-pale:#e1f2e0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--blanc);overflow:hidden}
body{font-family:var(--font-sans);color:var(--noir);font-weight:300;cursor:none}

/* Scène 1920×1080 mise à l'échelle de l'écran */
#scene{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--blanc);overflow:hidden}

/* ---------- Bandeau haut ---------- */
.haut{position:absolute;left:0;top:0;width:1920px;height:180px;display:flex}
.haut__prog{width:540px;height:180px;background:var(--prog);color:var(--prog-texte);padding:28px 48px;display:flex;flex-direction:column;justify-content:center;transition:background .5s}
.haut__type{font-size:34px;line-height:40px;font-weight:300;letter-spacing:.06em}
.haut__nom{font-size:84px;line-height:92px;font-weight:900;letter-spacing:.01em}
.haut__titre{flex:1;height:180px;background:var(--blanc);border-bottom:1px solid var(--gris);padding:0 48px;display:flex;flex-direction:column;justify-content:center}
.haut__titre h1{margin:0;font-size:48px;line-height:58px;font-weight:300;text-transform:uppercase;letter-spacing:.02em}
.haut__semaine{font-size:32px;line-height:42px;font-weight:300}
.haut__heure{width:360px;height:180px;background:var(--blanc);color:var(--noir);border-bottom:1px solid var(--gris);display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:0 48px}
.haut__clock{font-size:80px;line-height:88px;font-weight:300;font-variant-numeric:tabular-nums}
.haut__date{font-family:var(--font-condensed);font-size:24px;line-height:30px;font-weight:400}
.haut__date::first-letter{text-transform:uppercase}
.coin{position:absolute;top:180px;width:90px;height:90px;background:var(--prog);transition:background .5s}
.coin--g{left:0}

/* ---------- Grille ---------- */
.grille{position:absolute;left:76px;right:76px;top:220px;height:812px;display:grid;grid-template-columns:96px repeat(5,1fr);transition:opacity .45s}
.grille.sortie{opacity:0}
.col-heures{position:relative}
.heure{position:absolute;right:16px;font-family:var(--font-condensed);font-size:22px;font-weight:400;transform:translateY(-50%)}
.jour{position:relative}
.jour__entete{height:60px;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--blanc);border-bottom:2px solid var(--noir);font-size:28px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.jour__entete span{font-weight:300}
.jour.aujourdhui .jour__entete{background:var(--prog);color:var(--prog-texte)}
.jour__corps{position:absolute;left:0;right:0;top:60px;bottom:0}
.ligne{position:absolute;left:0;right:0;border-top:1px solid #ededed}
.ligne--demi{display:none}
.cours{position:absolute;left:6px;right:6px;background:var(--prog-pale);border-left:8px solid var(--prog);padding:10px 14px;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.cours__h{font-family:var(--font-condensed);font-size:20px;line-height:24px;font-weight:700}
.cours__m{font-size:25px;line-height:30px;font-weight:700}
.cours__d{font-size:20px;line-height:25px;font-weight:400}
.cours--court .cours__d{display:none}
.vide{position:absolute;left:0;right:0;top:50%;text-align:center;font-size:22px;font-weight:300;color:#6b6b6b}

/* ---------- Progression ---------- */
.progression{position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--gris-pale)}
#barre{height:100%;width:0;background:var(--prog)}
#barre.go{animation:remplir var(--duree) linear forwards}
.pause #barre{animation-play-state:paused}
@keyframes remplir{to{width:100%}}
</style>
</head>
<body>
<div id="scene">
  <header class="haut">
    <div class="haut__prog"><div class="haut__type" id="pType"></div><div class="haut__nom" id="pNom"></div></div>
    <div class="haut__titre"><h1>Emploi du temps</h1><div class="haut__semaine" id="semaine"></div></div>
    <div class="haut__heure"><div class="haut__clock" id="clock">--:--</div><div class="haut__date" id="date"></div></div>
  </header>
  <main class="grille" id="grille"></main>
  <div class="progression"><div id="barre"></div></div>
</div>

<script>
/* =====================================================================
   PARAMÈTRES — à modifier
   ===================================================================== */

// Durée d'affichage de chaque formation, en secondes
const DUREE = 12;

// Libellé de la semaine. Laisser "" pour calculer automatiquement la semaine en cours.
const SEMAINE = "";

// Plage horaire affichée
const HEURE_DEBUT = 8;   // 8h00
const HEURE_FIN   = 18;  // 18h00

// Données injectées par EDT_actualisation.py (ne pas modifier à la main)
const LUNDI_DONNEES = "__LUNDI__";   // lundi de la semaine affichée (AAAA-MM-JJ)
const FORMATIONS = __FORMATIONS__;

/* =====================================================================
   Moteur d'affichage — rien à modifier en dessous
   ===================================================================== */
const JOURS = [["lun","Lundi"],["mar","Mardi"],["mer","Mercredi"],["jeu","Jeudi"],["ven","Vendredi"]];
const scene = document.getElementById("scene");
const grille = document.getElementById("grille");
const $ = id => document.getElementById(id);

function ajuster(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  scene.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener("resize", ajuster); ajuster();

function pale(hex, t=.16){ // couleur pleine éclaircie (pas de transparence)
  const n = parseInt(hex.slice(1),16), r=n>>16, g=n>>8&255, b=n&255;
  const m = c => Math.round(255 - (255-c)*t);
  return `rgb(${m(r)},${m(g)},${m(b)})`;
}
const minutes = s => { const [h,m] = s.split(":").map(Number); return h*60+(m||0); };

function lundiCourant(){
  if (/^\d{4}-\d{2}-\d{2}$/.test(LUNDI_DONNEES)){ const [a,m,j] = LUNDI_DONNEES.split("-").map(Number); return new Date(a,m-1,j); }
  const d = new Date(); d.setHours(0,0,0,0);
  const j = d.getDay();                  // 0 = dimanche
  d.setDate(d.getDate() + (j===0 ? 1 : j===6 ? 2 : 1-j)); // week-end : semaine suivante
  return d;
}
const lundi = lundiCourant();
function libSemaine(){
  if (SEMAINE) return SEMAINE;
  const v = new Date(lundi); v.setDate(v.getDate()+4);
  const f = (d,o) => d.toLocaleDateString("fr-FR", o);
  const memeMois = lundi.getMonth()===v.getMonth();
  return `Semaine du ${f(lundi, memeMois ? {day:"numeric"} : {day:"numeric",month:"long"})} au ${f(v,{day:"numeric",month:"long",year:"numeric"})}`;
}
$("semaine").textContent = libSemaine();

document.documentElement.style.setProperty("--duree", DUREE+"s");

function construire(f){
  const debut = HEURE_DEBUT*60, fin = HEURE_FIN*60, h = 812-60;
  const y = m => (m-debut)/(fin-debut)*h;
  const auj = new Date(); auj.setHours(0,0,0,0);
  grille.innerHTML = "";

  const ch = document.createElement("div"); ch.className = "col-heures";
  for (let t=debut; t<=fin; t+=60){
    const e = document.createElement("div"); e.className = "heure";
    e.style.top = (60 + y(t)) + "px"; e.textContent = (t/60) + "h";
    ch.appendChild(e);
  }
  grille.appendChild(ch);

  JOURS.forEach(([k,lib],i) => {
    const date = new Date(lundi); date.setDate(date.getDate()+i);
    const col = document.createElement("section"); col.className = "jour";
    if (date.getTime()===auj.getTime()) col.classList.add("aujourdhui");
    const en = document.createElement("div"); en.className = "jour__entete";
    en.textContent = lib + " ";
    const sp = document.createElement("span"); sp.textContent = date.getDate(); en.appendChild(sp);
    const corps = document.createElement("div"); corps.className = "jour__corps";
    for (let t=debut; t<fin; t+=30){
      const l = document.createElement("div");
      l.className = "ligne" + (t%60 ? " ligne--demi" : "");
      l.style.top = y(t)+"px"; corps.appendChild(l);
    }
    const liste = f.cours.filter(c => c.jour===k);
    liste.forEach(c => {
      const a = Math.max(minutes(c.debut),debut), b = Math.min(minutes(c.fin),fin);
      if (b<=a) return;
      const el = document.createElement("div"); el.className = "cours";
      el.style.top = (y(a)+3)+"px"; el.style.height = (y(b)-y(a)-6)+"px";
      if (c.groupe==="TD1" || c.groupe==="TD2"){ // TD en parallèle : demi-colonne
        el.style.width = "calc(50% - 9px)"; el.style.right = "auto";
        el.style.left = c.groupe==="TD1" ? "6px" : "calc(50% + 3px)";
      }
      if (b-a < 120) el.classList.add("cours--court");
      const hh = document.createElement("div"); hh.className="cours__h"; hh.textContent = `${c.debut.replace(":","h")} – ${c.fin.replace(":","h")}` + (c.groupe==="TD1"||c.groupe==="TD2" ? ` · ${c.groupe}` : "");
      const mm = document.createElement("div"); mm.className="cours__m"; mm.textContent = c.matiere;
      el.append(hh, mm);
      [c.prof, c.salle].filter(Boolean).forEach(x => {
        const d = document.createElement("div"); d.className="cours__d"; d.textContent = x; el.appendChild(d);
      });
      corps.appendChild(el);
    });
    if (!liste.length){
      const v = document.createElement("div"); v.className="vide"; v.textContent = "Pas de cours"; corps.appendChild(v);
    }
    col.append(en, corps);
    grille.appendChild(col);
  });
}

let i = 0, minuteur = null, enPause = false;
function afficher(n){
  i = (n + FORMATIONS.length) % FORMATIONS.length;
  const f = FORMATIONS[i], root = document.documentElement.style;
  grille.classList.add("sortie");
  setTimeout(() => {
    root.setProperty("--prog", f.couleur);
    root.setProperty("--prog-texte", f.texte);
    root.setProperty("--prog-pale", pale(f.couleur));
    $("pType").textContent = f.type;
    $("pNom").textContent = f.nom;
    construire(f);
    const barre = $("barre");
    barre.classList.remove("go"); void barre.offsetWidth; barre.classList.add("go");
    grille.classList.remove("sortie");
  }, 450);
  clearTimeout(minuteur);
  if (!enPause) minuteur = setTimeout(() => afficher(i+1), DUREE*1000);
}

// Clavier : ← → pour changer, Espace pour mettre en pause
addEventListener("keydown", e => {
  if (e.key==="ArrowRight") afficher(i+1);
  else if (e.key==="ArrowLeft") afficher(i-1);
  else if (e.key===" "){
    enPause = !enPause; document.body.classList.toggle("pause", enPause);
    if (enPause) clearTimeout(minuteur); else afficher(i);
  }
});

function horloge(){
  const d = new Date();
  $("clock").textContent = d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  $("date").textContent = d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
}
horloge(); setInterval(horloge, 10000);

// Recharge la page chaque nuit (nouvelle semaine, mises à jour du fichier)
(() => { const n = new Date(), r = new Date(n); r.setHours(3,0,0,0); if (r <= n) r.setDate(r.getDate()+1); setTimeout(() => location.reload(), r - n); })();

afficher(0);
</script>
</body>
</html>
